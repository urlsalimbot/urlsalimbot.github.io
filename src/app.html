<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="text-scale" content="scale" />
    <meta name="theme-color" content="#0b0a0c" />
    <meta
      name="description"
      content="Earl Salimbot — game developer and 3D artist in Bulacan, Philippines. Selected work, skills, and contact."
    />
    <link rel="icon" href="/favicon.svg" />
    <link rel="preload" href="/fonts/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/libre-franklin.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('theme');
          document.documentElement.dataset.theme = saved || 'dark';
        } catch {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
